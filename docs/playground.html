<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyntropyRL | Live Diagnostics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fira+Code&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #111827; }
        .font-mono { font-family: 'Fira Code', monospace; }
        .sidebar { border-right: 1px solid #e5e7eb; height: 100vh; position: fixed; width: 250px; overflow-y: auto; }
        .main-content { margin-left: 250px; padding: 2rem; }
        .panel { border: 1px solid #e2e8f0; border-radius: 6px; background: #ffffff; box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); }
        .log-terminal { background: #0f172a; color: #f8fafc; font-family: 'Fira Code', monospace; font-size: 0.85rem; padding: 1rem; overflow-y: auto; height: 300px; border-radius: 6px; }
    </style>
</head>
<body>

    <nav class="sidebar bg-slate-50 p-6">
        <div class="font-semibold text-lg mb-6 tracking-tight">SyntropyRL</div>
        <div class="space-y-3 text-sm text-slate-600">
            <a href="index.html" class="block hover:text-slate-900">Getting Started</a>
            <a href="atlas.html" class="block hover:text-slate-900">Failure Atlas</a>
            <a href="playground.html" class="block text-blue-600 font-medium">Live Diagnostics</a>
        </div>
    </nav>

    <main class="main-content h-screen flex flex-col max-w-6xl">
        <div class="mb-6 pb-4 border-b border-slate-200">
            <h1 class="text-2xl font-semibold text-slate-900">Live Training Diagnostics</h1>
            <p class="text-slate-500 text-sm mt-1">Simulate an RL training loop and observe real-time failure detection.</p>
        </div>

        <div class="flex gap-6 flex-1 min-h-0">
            
            <!-- Controls -->
            <div class="w-64 flex flex-col gap-4">
                <div class="panel p-4">
                    <div class="font-medium text-sm mb-3 text-slate-900">Simulation Control</div>
                    <button id="btn-start" class="w-full bg-slate-900 text-white text-sm font-medium py-2 px-4 rounded hover:bg-slate-800 transition-colors mb-2">Run Healthy Epochs</button>
                    <button id="btn-stop" class="w-full bg-slate-100 text-slate-600 text-sm font-medium py-2 px-4 rounded hover:bg-slate-200 transition-colors" disabled>Halt Training</button>
                </div>
                
                <div class="panel p-4">
                    <div class="font-medium text-sm mb-3 text-slate-900">Inject Pathologies</div>
                    <button id="btn-hack" class="w-full text-left bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 text-sm font-medium py-2 px-3 rounded mb-2 transition-colors">1. Reward Hacking</button>
                    <button id="btn-collapse" class="w-full text-left bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 text-sm font-medium py-2 px-3 rounded mb-2 transition-colors">2. Entropy Collapse</button>
                    <button id="btn-kl" class="w-full text-left bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 text-sm font-medium py-2 px-3 rounded transition-colors">3. KL Divergence Spike</button>
                </div>
            </div>

            <!-- Charts & Logs -->
            <div class="flex-1 flex flex-col gap-6 min-w-0">
                <div class="panel p-4 flex-1 min-h-[300px] relative">
                    <canvas id="rlChart"></canvas>
                </div>
                
                <div class="log-terminal" id="terminal">
                    <div class="text-slate-400">SyntropyRL Diagnostics Engine v1.0.0</div>
                    <div class="text-slate-400">Status: Awaiting telemetry...</div>
                </div>
            </div>

        </div>
    </main>

    <script src="assets/playground.js"></script>
</body>
</html>
