[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "syntropyrl"
version = "0.1.0"
description = "Find out why your RL run is not learning. Zero-dependency failure detection for LLM reinforcement learning."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "syntropyrl contributors" }]
keywords = [
  "reinforcement-learning",
  "rlhf",
  "grpo",
  "ppo",
  "llm",
  "debugging",
  "observability",
  "reward-hacking",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "opentelemetry-api",
  "prometheus_client",
  "rich>=13.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "hypothesis"]

[project.scripts]
syntropyrl = "syntropyrl.cli:main"

[project.urls]
Homepage = "https://syntropyrl.dev"
Playground = "https://syntropyrl.dev/playground.html"
Atlas = "https://syntropyrl.dev/atlas.html"
Source = "https://github.com/syntropyrl/syntropyrl"
Issues = "https://github.com/syntropyrl/syntropyrl/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/syntropyrl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B905", "UP006", "UP035"]

[tool.mypy]
strict = true
